name: caseproof-local
x-app: &app
  image: caseproof-local:dev
  build: .
  init: true
  networks: [local]
  volumes: [state:/data]
  environment: &env
    DATA_DIR: /data
    SQLITE_URL: sqlite:////data/caseproof.db
    DUCKDB_PATH: /data/bank.duckdb
    OBJECT_DIR: /data/objects
    EVAL_KIT_V3: /data/kit_v3
    TRAIL_FEED_PATH: /data/kit_v3/trail_feed.json
    TRAIL_FEED_URL: http://trail-feed:8000
    LOCAL_OCR_URL: http://ocr:8000
    MOCK_SERVICES_URL: http://simulator:8000
    LOCAL_SERVICE_HOSTS: '["simulator", "ocr", "trail-feed"]'
    LLM_PROVIDER: local
    LLM_MODE: local
    EXTERNAL_WORKER: "true"
    JOB_LEASE_SECONDS: "15"
    CUSTOMER_PORTAL: "true"
    PRELOADED_DEMO: "true"
    PUBLIC_BASE_URL: http://127.0.0.1:8080
  restart: unless-stopped
  healthcheck: &health
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
    interval: 5s
    timeout: 4s
    retries: 20
    start_period: 20s
services:
  init:
    <<: *app
    command: [python, -m, local_services.bootstrap]
    restart: "no"
    healthcheck: {disable: true}
  ocr:
    <<: *app
    command: [python, -m, uvicorn, local_services.ocr:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
    volumes: []
  trail-feed:
    <<: *app
    command: [python, -m, uvicorn, local_services.feed:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
    depends_on:
      init: {condition: service_completed_successfully}
  simulator:
    <<: *app
    command: [python, -m, uvicorn, mock_services.bank_mock:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
    depends_on:
      init: {condition: service_completed_successfully}
  api:
    <<: *app
    depends_on:
      init: {condition: service_completed_successfully}
      ocr: {condition: service_healthy}
      trail-feed: {condition: service_healthy}
      simulator: {condition: service_healthy}
  gateway:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    init: true
    networks: [local, browser]
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1/health | grep -q caseproof-api"]
      interval: 5s
      timeout: 4s
      retries: 10
  worker:
    <<: *app
    command: [python, -m, local_services.worker]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, local_services.health]
      interval: 5s
      timeout: 4s
      retries: 10
  validate:
    <<: *app
    profiles: [validation]
    command: [python, -m, local_services.validate]
    volumes: [state:/data, "browser-results:/browser:ro"]
    environment:
      <<: *env
      API_BASE_URL: http://api:8000
    restart: "no"
    healthcheck: {disable: true}
    depends_on:
      worker: {condition: service_healthy}
  tests:
    <<: *app
    profiles: [validation]
    command: [python, -m, pytest, -q, --basetemp=/tmp/pytest, -o, cache_dir=/tmp/pytest-cache]
    volumes: []
    environment:
      DATA_DIR: /tmp/caseproof-tests
      SQLITE_URL: sqlite:////tmp/caseproof-tests/cases.db
      DUCKDB_PATH: /tmp/caseproof-tests/bank.duckdb
      OBJECT_DIR: /tmp/caseproof-tests/objects
      LLM_PROVIDER: gemini
      EXTERNAL_WORKER: "false"
      CUSTOMER_PORTAL: "false"
    restart: "no"
    healthcheck: {disable: true}
  browser-check:
    image: caseproof-browser-check:dev
    build:
      context: .
      dockerfile: Dockerfile.browser
    profiles: [validation]
    init: true
    networks: [local]
    shm_size: 1gb
    environment:
      API_BASE_URL: http://gateway
      OUTPUT_DIR: /artifacts
    volumes: [browser-results:/artifacts]
    depends_on:
      gateway: {condition: service_healthy}
      worker: {condition: service_healthy}
  recovery-check:
    <<: *app
    profiles: [validation]
    user: "0:0"
    command: [python, -m, local_services.recovery]
    volumes: [state:/data, "browser-results:/browser:ro", "/var/run/docker.sock:/var/run/docker.sock"]
    environment:
      <<: *env
      API_BASE_URL: http://api:8000
      DOCKER_PROJECT: ${COMPOSE_PROJECT_NAME:-caseproof-local}
    restart: "no"
    healthcheck: {disable: true}
networks:
  local:
    internal: true
  browser:
volumes:
  state:
  browser-results:
